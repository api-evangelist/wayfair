aid: wayfair
name: Wayfair
description: >-
  Wayfair Inc. is one of the world's largest online destinations for home goods and furniture, serving over 20 million
  customers and 10,000+ suppliers. Wayfair's Developer Portal provides GraphQL-based APIs enabling suppliers to manage
  purchase orders, inventory updates, product catalog management, advanced shipment notifications, and returns. The
  platform is built on federated GraphQL architecture using domain-oriented microservices, allowing suppliers to request
  only the data they need.
